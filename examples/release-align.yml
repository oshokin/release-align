manifest:
  version: "1.0"
  defaults:
    revision: refs/heads/Release-26.3.0
  projects:
    - name: calyra
      path: lamiona/search/calyra
      url: ssh://git@git.example.com/lamiona/search/calyra.git
      groups: [lamiona, lamiona/search]
    - name: quillbox
      path: lamiona/backend/quillbox
      url: ssh://git@git.example.com/lamiona/backend/quillbox.git
      groups: [lamiona, lamiona/backend]
      revision: refs/tags/v26.3.1

release-align:
  schema-version: 1
  log-level: info
  release: Lamiona 26.3.0
  gitlab:
    url: https://git.example.com
    groups: [lamiona]
    clone-protocol: ssh
  timeouts:
    probe: 5s
    fetch: 1m
    local: 40s
    clone: 15m
    archive: 15m
