manifest:
  version: "1.0"
  defaults:
    revision: refs/heads/Release-26.3.0
  projects:
    - name: pasifae
      path: mailion/search/pasifae
      url: ssh://git@gitlab.stageoffice.ru/mailion/search/pasifae.git
      groups: [mailion, mailion/search]
    - name: mailbek
      path: mailion/backend/mailbek
      url: ssh://git@gitlab.stageoffice.ru/mailion/backend/mailbek.git
      groups: [mailion, mailion/backend]
      revision: refs/tags/v26.3.1

release-align:
  schema-version: 1
  release: Mailion 26.3.0
  gitlab:
    url: https://gitlab.stageoffice.ru
    groups: [mailion]
    clone-protocol: ssh
  timeouts:
    probe: 5s
    fetch: 1m
    local: 40s
    clone: 15m
    archive: 15m
