version: 2
project_name: release-align
builds:
  - main: .
    binary: release-align
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/oshokin/release-align/cmd.Version={{.Version}} -X github.com/oshokin/release-align/cmd.Commit={{.Commit}} -X github.com/oshokin/release-align/cmd.BuildTime={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - examples/*
checksum:
  name_template: checksums.txt
release:
  github:
    owner: oshokin
    name: release-align
